[pytest]
testpaths = tests
timeout = 180
markers =
    e2e: end-to-end tests with a real server, real browsers and real WebRTC media
    live_platforms: opt-in tests against the real Zoom / Google Meet / Teams sites
filterwarnings =
    ignore::DeprecationWarning:starlette.*
    ignore:Using `httpx` with `starlette.testclient` is deprecated
